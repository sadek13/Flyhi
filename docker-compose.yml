services:
  action_server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    env_file:
      - .env
    ports:
      - "5055:5055"

  rasa:
    build:
      context: .
      dockerfile: Dockerfile.rasa
    depends_on:
      - action_server
    ports:
      - "5005:5005"

  web:
    image: python:3.10-alpine
    working_dir: /site
    volumes:
      - ./web:/site:ro
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
    ports:
      - "8080:8080"
